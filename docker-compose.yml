services:
  db:
    image: postgres:16-alpine
    container_name: table-games-db
    environment:
      POSTGRES_DB: tablegames
      POSTGRES_USER: tablegames
      POSTGRES_PASSWORD: tablegames_local
    volumes:
      - table-games-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablegames -d tablegames"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  game:
    build:
      context: .
    image: table-games:local
    container_name: table-games
    environment:
      NODE_ENV: "development"
      PORT: "4173"
      DATABASE_URL: "postgresql://tablegames:tablegames_local@db:5432/tablegames"
      VK_APP_ID: "${VK_APP_ID:-}"
      VK_APP_SECRET: "${VK_APP_SECRET:-}"
    command: ["node", "dev-server.js"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    ports:
      - "4173:4173"
    restart: always
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: package.json

volumes:
  table-games-data:
